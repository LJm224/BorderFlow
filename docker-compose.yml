services:
  db:
    image: postgres:16-alpine
    container_name: borderflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: borderflow
      POSTGRES_PASSWORD: borderflow
      POSTGRES_DB: borderflow
    ports:
      - "15432:5432"
    volumes:
      - borderflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borderflow -d borderflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  borderflow_pgdata:
